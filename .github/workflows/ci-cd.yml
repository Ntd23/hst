# Description: CI builds the Nuxt client and validates the Botble Laravel admin, then deploys main to the server over SSH.
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"
  PM2_VERSION: "6"
  PHP_VERSION: "8.3"
  CLIENT_DIR: client
  ADMIN_DIR: admin

jobs:
  client-ci:
    name: Nuxt client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/pnpm-lock.yaml

      - name: Install dependencies (including Three.js banner)
        run: pnpm install --frozen-lockfile --prod=false

      - name: Verify banner dependencies
        run: pnpm list three @types/three vue-tsc --depth=0

      - name: Build Nuxt
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

      - name: Pack Nuxt output
        run: tar -czf nuxt-output.tar.gz .output package.json

      - name: Upload Nuxt output
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-output
          path: ${{ env.CLIENT_DIR }}/nuxt-output.tar.gz
          retention-days: 1

  admin-ci:
    name: Laravel admin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.ADMIN_DIR }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, gd, mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('admin/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - client-ci
      - admin-ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Download Nuxt output
        uses: actions/download-artifact@v4
        with:
          name: nuxt-output
          path: .

      - name: Prepare upload directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY }}
          script: |
            rm -rf /tmp/hst-deploy
            mkdir -p /tmp/hst-deploy

      - name: Upload Nuxt output to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY }}
          source: nuxt-output.tar.gz
          target: /tmp/hst-deploy

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/hisotechgroup/main' }}
          BRANCH_NAME: ${{ github.ref_name }}
          NODE_VERSION: ${{ env.NODE_VERSION }}
          PNPM_VERSION: ${{ env.PNPM_VERSION }}
          PM2_VERSION: ${{ env.PM2_VERSION }}
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY }}
          envs: DEPLOY_PATH,BRANCH_NAME,NODE_VERSION,PNPM_VERSION,PM2_VERSION
          script: |
            set -euo pipefail

            echo "Deploy path: ${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"
            echo "Syncing branch: ${BRANCH_NAME}"
            git fetch --prune origin
            git reset --hard
            git clean -fd -- admin client
            git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
            git reset --hard "origin/${BRANCH_NAME}"

            echo "Installing admin dependencies"
            cd admin
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
            echo "Optimizing admin"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan cms:publish:assets || true
            php artisan config:cache
            php artisan view:cache

            echo "Deploying prebuilt client output"
            cd ../client
            rm -rf .output
            tar -xzf /tmp/hst-deploy/nuxt-output.tar.gz
            rm -f /tmp/hst-deploy/nuxt-output.tar.gz

            echo "Preparing Node.js and PM2"
            DEPLOY_NVM_DIR="${NVM_DIR:-${HOME}/.nvm}"
            if [ -s "${DEPLOY_NVM_DIR}/nvm.sh" ]; then
              export NVM_DIR="${DEPLOY_NVM_DIR}"
              set +u
              . "${NVM_DIR}/nvm.sh"
              if ! nvm use "${NODE_VERSION}"; then
                echo "Node ${NODE_VERSION} is not installed in NVM; trying the default NVM version"
                nvm use default || true
              fi
              set -u
            fi

            if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
              echo "Node.js/npm not found for deploy user. Install Node ${NODE_VERSION} or fix SERVER_USER/NVM configuration."
              exit 1
            fi

            DEPLOY_NPM_PREFIX="${HOME}/.local/npm"
            export PATH="${DEPLOY_NPM_PREFIX}/bin:${PATH}"
            if ! command -v pm2 >/dev/null 2>&1; then
              echo "PM2 not found; installing PM2 ${PM2_VERSION} for deploy user"
              mkdir -p "${DEPLOY_NPM_PREFIX}"
              npm install --global --prefix "${DEPLOY_NPM_PREFIX}" "pm2@${PM2_VERSION}"
            fi

            pm2 --version
            if pm2 describe hst-client >/dev/null 2>&1; then
              echo "Reloading pm2 app"
              pm2 reload hst-client --update-env
            else
              echo "Starting pm2 app"
              pm2 start "$(pwd)/.output/server/index.mjs" --name hst-client --update-env
            fi
            pm2 save
