# Description: CI validates the Nuxt client and Laravel admin; CD deploys approved pushes to the production server over SSH.
name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - dung
  pull_request:
    branches:
      - main
      - master
      - dung
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9"
  PHP_VERSION: "8.3"
  CLIENT_DIR: client
  ADMIN_DIR: admin

jobs:
  client-ci:
    name: Client build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: pnpm run build

  admin-ci:
    name: Admin checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, gd, mbstring, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Validate composer file
        working-directory: ${{ env.ADMIN_DIR }}
        run: composer validate --no-check-publish

      - name: Prepare Laravel environment
        working-directory: ${{ env.ADMIN_DIR }}
        run: cp .env.example .env

      - name: Install admin dependencies
        working-directory: ${{ env.ADMIN_DIR }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        working-directory: ${{ env.ADMIN_DIR }}
        run: php artisan key:generate --force

      - name: Run admin tests
        working-directory: ${{ env.ADMIN_DIR }}
        run: php artisan test

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - client-ci
      - admin-ci
    if: github.event_name != 'pull_request'
    environment: production

    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_PORT}" ]; then
            SSH_PORT="22"
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "bash -se" <<EOF
          set -euo pipefail

          cd "${DEPLOY_PATH}"
          git fetch --prune origin
          git checkout "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

          cd admin
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          cd ../client
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate
          pnpm install --frozen-lockfile
          pnpm run build

          if command -v pm2 >/dev/null 2>&1; then
            pm2 reload hst-client || pm2 start .output/server/index.mjs --name hst-client
          fi
          EOF
