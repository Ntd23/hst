# Description: CI builds the Nuxt client and validates the Botble Laravel admin, then deploys main to the server over SSH.
name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.7.0"
  PHP_VERSION: "8.3"
  CLIENT_DIR: client
  ADMIN_DIR: admin

jobs:
  client-ci:
    name: Nuxt client
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.CLIENT_DIR }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ${{ env.CLIENT_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build

  admin-ci:
    name: Laravel admin
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.ADMIN_DIR }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: curl, gd, mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('admin/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate app key
        run: php artisan key:generate --force

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - client-ci
      - admin-ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/hisotechgroup/main' }}
          BRANCH_NAME: ${{ github.ref_name }}
          NODE_VERSION: ${{ env.NODE_VERSION }}
          PNPM_VERSION: ${{ env.PNPM_VERSION }}
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY }}
          envs: DEPLOY_PATH,BRANCH_NAME,NODE_VERSION,PNPM_VERSION
          script: |
            set -euo pipefail

            echo "Deploy path: ${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"
            echo "Syncing branch: ${BRANCH_NAME}"
            git fetch --prune origin
            git reset --hard
            git clean -fd -- admin client
            git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
            git reset --hard "origin/${BRANCH_NAME}"

            echo "Installing admin dependencies"
            cd admin
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
            echo "Optimizing admin"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan storage:link || true
            php artisan cms:publish:assets || true
            php artisan config:cache
            php artisan view:cache

            echo "Installing client dependencies"
            cd ../client
            echo "Cleaning stale client dependencies and build output"
            rm -rf node_modules .pnpm-store .nuxt .output
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
              nvm install "$NODE_VERSION"
              nvm use "$NODE_VERSION"
            fi
            echo "Node version: $(node -v)"
            NODE_MAJOR="$(node -p "process.versions.node.split('.')[0]")"
            if [ "$NODE_MAJOR" != "$NODE_VERSION" ]; then
              echo "Expected Node ${NODE_VERSION}.x, got $(node -v). Install nvm on the server or switch the deploy user to Node ${NODE_VERSION}." >&2
              exit 1
            fi
            echo "Corepack version: $(corepack --version)"
            corepack enable
            corepack prepare "pnpm@${PNPM_VERSION}" --activate
            echo "pnpm version: $(pnpm -v)"
            pnpm install --frozen-lockfile
            node -e "const statuses = require('statuses'); require('http-errors'); console.log('statuses package OK:', statuses.codes.includes(100), statuses.message[100])"
            echo "Building client"
            NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

            if command -v pm2 >/dev/null 2>&1; then
              echo "Reloading pm2 app"
              pm2 reload hst-client --update-env || pm2 start .output/server/index.mjs --name hst-client --update-env
              pm2 save
            else
              echo "pm2 not found; build completed without process reload"
            fi
